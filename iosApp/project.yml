# XcodeGen spec. Generate the project with:  cd iosApp && xcodegen generate
name: iosApp
options:
  bundleIdPrefix: com.goldenpaw
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: ""   # set your Apple team id to run on a device
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes: ["PrivacyInfo.xcprivacy"]
      # Apple privacy manifest: must be copied into the app bundle as a resource.
      - path: iosApp/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: GoldenPaw
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: "Choose a photo of your pet, a symptom, or a vet or vaccine card."
        NSCameraUsageDescription: "Scan your pet's vet and vaccine cards. The camera is only used while you scan, and pages stay on this device."
        CADisableMinimumFrameDurationOnPhone: true
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        # Push (APNs) for Debug builds run from Xcode. Release (TestFlight / App Store) builds use
        # iosApp/iosApp.Release.entitlements, which says "production".
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldenpaw.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lsqlite3"]
        FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.Release.entitlements
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    dependencies:
      - framework: ComposeApp.framework
        embed: false
        implicit: true
