<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ '/' | relative_url }}">🐾 {{ site.title }}</a>
    <nav>
      <a href="{{ '/support/' | relative_url }}">Support</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      <a href="{{ '/terms/' | relative_url }}">Terms</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>© {{ 'now' | date: '%Y' }} {{ site.owner_name }} · <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a></p>
    <p><a href="{{ '/delete-account/' | relative_url }}">Delete your account or data</a></p>
  </footer>
</body>
</html>
