name: Website

# Publishes site/ (privacy, terms, account deletion, support) to GitHub Pages.
# One-time setup: Settings → Pages → Source "GitHub Actions", and repository variable PAGES_ENABLED=true.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - name: Refuse to publish unfinished placeholders
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.PAGES_ENABLED == 'true')
        run: |
          if grep -rl "TODO:" _site --include=*.html; then
            echo "::error::Fill the TODO values in site/_config.yml before publishing."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.PAGES_ENABLED == 'true')
        with:
          path: ./_site

  deploy:
    name: Publish
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.PAGES_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
