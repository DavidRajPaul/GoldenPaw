name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build the iOS framework (macOS runner)"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-tests:
    name: Shared logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:desktopTest --stacktrace
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-report
          path: shared/build/reports/tests/
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        env:
          # Optional repository secrets: build with care-team sharing and AI summaries switched on.
          GOLDENPAW_SUPABASE_URL: ${{ secrets.GOLDENPAW_SUPABASE_URL }}
          GOLDENPAW_SUPABASE_ANON_KEY: ${{ secrets.GOLDENPAW_SUPABASE_ANON_KEY }}
        run: ./gradlew :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GoldenPaw-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  desktop:
    name: Desktop (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:compileKotlinDesktop --stacktrace

  ios:
    name: iOS framework
    if: (github.event_name == 'workflow_dispatch' && inputs.ios) || github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
