name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build the iOS framework (macOS runner)"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-tests:
    name: Unit tests (shared + app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:desktopTest :composeApp:desktopTest --stacktrace --continue
      # Surface failing tests (and compile errors) as annotations on the run summary.
      - name: Report test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('*/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      msg = (bad.get('message') or bad.text or '').strip().splitlines()[0][:300]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            composeApp/build/reports/tests/
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        env:
          # Optional repository secrets: build with care-team sharing and AI summaries switched on.
          GOLDENPAW_SUPABASE_URL: ${{ secrets.GOLDENPAW_SUPABASE_URL }}
          GOLDENPAW_SUPABASE_ANON_KEY: ${{ secrets.GOLDENPAW_SUPABASE_ANON_KEY }}
          GOLDENPAW_FIREBASE_PROJECT_ID: ${{ secrets.GOLDENPAW_FIREBASE_PROJECT_ID }}
          GOLDENPAW_FIREBASE_SENDER_ID: ${{ secrets.GOLDENPAW_FIREBASE_SENDER_ID }}
          GOLDENPAW_FIREBASE_ANDROID_APP_ID: ${{ secrets.GOLDENPAW_FIREBASE_ANDROID_APP_ID }}
          GOLDENPAW_FIREBASE_API_KEY: ${{ secrets.GOLDENPAW_FIREBASE_API_KEY }}
        run: |
          set -o pipefail
          ./gradlew :composeApp:assembleDebug --stacktrace 2>&1 | tee gradle.log
      - name: Report Gradle errors
        if: failure()
        run: |
          test -f gradle.log || exit 0
          { grep -A6 "What went wrong" gradle.log; grep -E "^e: |error:|Script compilation error|Unresolved reference" gradle.log; } \
            | grep -v "^--$" | sort -u | head -30 | while IFS= read -r line; do echo "::error title=Gradle::${line}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: GoldenPaw-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  desktop:
    name: Desktop (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          set -o pipefail
          ./gradlew :composeApp:compileKotlinDesktop --stacktrace 2>&1 | tee gradle.log
      - name: Report Gradle errors
        if: failure()
        run: |
          test -f gradle.log || exit 0
          { grep -A6 "What went wrong" gradle.log; grep -E "^e: |error:|Script compilation error|Unresolved reference" gradle.log; } \
            | grep -v "^--$" | sort -u | head -30 | while IFS= read -r line; do echo "::error title=Gradle::${line}"; done

  ios:
    name: iOS framework
    if: (github.event_name == 'workflow_dispatch' && inputs.ios) || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Link Kotlin framework
        run: |
          set -o pipefail
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace 2>&1 | tee ios-build.log
      - name: Generate Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen generate
      - name: Build iOS app (simulator)
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO -derivedDataPath iosApp/build build 2>&1 | tee -a ios-build.log
      - name: Check privacy manifest and app icon are bundled
        run: |
          APP=iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon" "$APP/Info.plist"
      # Surface compiler/linker errors as annotations on the run summary (readable without the raw log).
      - name: Report build errors
        if: failure()
        run: |
          grep -E '^e: |error:|Undefined symbols|_kfun:' ios-build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error title=iOS build::${line}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: iosApp-xcodeproj
          path: iosApp/iosApp.xcodeproj
