org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Multiplatform
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
# Lets the project sync on Linux/Windows machines where Xcode isn't available.
kotlin.native.ignoreDisabledTargets=true

# App version (single source of truth for Android, Desktop and the in-app "About" screen)
goldenpaw.versionName=1.1.0
goldenpaw.versionCode=2
ksp.useKSP2=true