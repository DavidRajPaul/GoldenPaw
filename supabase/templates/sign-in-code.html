<!--
  GoldenPaw sign-in code email. Paste this into BOTH Supabase templates:
    Authentication → Emails → Templates → "Magic Link"      (subject: Your GoldenPaw code: {{ .Token }})
    Authentication → Emails → Templates → "Confirm signup"  (subject: Your GoldenPaw code: {{ .Token }})
  New email addresses get "Confirm signup"; returning ones get "Magic Link". Both must show the code.
-->
<div style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#2b2118">
  <p style="font-size:18px;margin:0 0 8px">🐾 <strong>GoldenPaw</strong></p>
  <p style="font-size:15px;margin:16px 0 8px">Your sign-in code is:</p>
  <p style="font-size:32px;letter-spacing:6px;font-weight:700;margin:8px 0 16px">{{ .Token }}</p>
  <p style="font-size:14px;color:#6f5f50;margin:0 0 16px">Type it into the app to finish signing in. It expires in an hour.</p>
  <p style="font-size:13px;color:#8a7a6a;margin:24px 0 0">If you didn't ask for this, you can ignore this email. Nobody can sign in without the code.</p>
</div>
